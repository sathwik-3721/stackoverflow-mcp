[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackoverflow-mcp"
version = "0.1.0"
description = "A Model Context Protocol server for coding agents to retrieve Stack Overflow knowledge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
stackoverflow-mcp = "stackoverflow_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stackoverflow_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
